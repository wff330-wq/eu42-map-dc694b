<style>
  :root { --walk:#16a34a; --trans:#2563eb; --fly:#dc2626; --stay:#d97706; --ink:#1f2937; --bg:#f4f6fb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif; color:var(--ink); background:var(--bg); }
  header { background:linear-gradient(135deg,#1a56db,#7c3aed); color:#fff; padding:22px 24px; }
  header h1 { margin:0; font-size:30px; line-height:1.3; }
  header p { margin:6px 0 0; font-size:17px; opacity:.95; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .stat { background:rgba(255,255,255,.18); border-radius:10px; padding:6px 14px; font-size:16px; }
  .layout { display:flex; height:calc(100vh - 140px); min-height:520px; }
  #side { width:400px; flex:0 0 400px; overflow-y:auto; background:#fff; border-right:1px solid #e5e7eb; }

  .toolbar { position:absolute; z-index:999; top:12px; left:412px; display:flex; gap:8px; flex-wrap:wrap; }
  .chip { background:#fff; border:1px solid #d1d5db; border-radius:20px; padding:6px 14px; font-size:15px; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.15); user-select:none; }
  .chip.on { color:#fff; border-color:transparent; }
  .chip.walk.on { background:var(--walk); }
  .chip.trans.on { background:var(--trans); }
  .chip.fly.on { background:var(--fly); }
  .item { padding:13px 16px; border-bottom:1px solid #eef0f4; cursor:pointer; display:flex; gap:12px; align-items:flex-start; }
  .item:hover { background:#f0f6ff; }
  .item.act { background:#e0ecff; border-left:5px solid var(--walk); padding-left:11px; }
  .item.act.trans { border-left-color:var(--trans); }
  .item.act.fly { border-left-color:var(--fly); }

  .dot { flex:0 0 14px; width:14px; height:14px; border-radius:50%; margin-top:6px; background:#9ca3af; }
  .dot.walk { background:var(--walk); } .dot.trans { background:var(--trans); }
  .dot.fly { background:var(--fly); } .dot.stay { background:var(--stay); }
  .item b { display:block; font-size:17px; }
  .item .date { font-size:14px; color:#6b7280; }
  .item .sub { font-size:14.5px; color:#4b5563; margin-top:2px; line-height:1.5; }
  .sec { padding:10px 16px 6px; font-size:15px; font-weight:700; color:#6b7280; background:#f9fafb; position:sticky; top:0; z-index:2; }
  .badge { display:inline-block; background:#fef3c7; color:#92400e; font-size:13.5px; border-radius:8px; padding:2px 8px; margin-top:4px; }

<script>

  {t:'stay', date:'10月9-11日', title:'里昂 Lyon 住2晚', sub:'Premiere Classe Lyon Centre Part Dieu · 雙床房 €168 · 8-17°C', at:STOPS.Lyon},

  {g:'第二段 · 朝聖之路 Le Puy → Cahors（10月13-29日）'},

  {t:'walk', date:'10月21日 · Day 9', title:'Saint-Côme → Estaing', sub:'20.5km · 5-13°C', r:'W9', km:'20.5km'},

  {t:'walk', date:'10月23日 · Day 11', title:'Golinhac → Conques', sub:'21km · 9-16°C', r:'W11', km:'21km'},
  {t:'trans', date:'10月24日 · Day 12', title:'Conques → Figeac', sub:'🚌🚆 巴士＋火車 · 8-18°C（唔行）', r:'C2'},

  {t:'walk', date:'10月27日 · Day 15', title:'Cahors → Limognes-en-Quercy', sub:'19km · 10-15°C', r:'W12', km:'19km'},

  {g:'第三段 · 城市遊'},

  {t:'trans', date:'11月11日', title:'Český Krumlov → Prague', sub:'陸路轉場 · -3-4°C / -2-6°C', r:'C8'},

  {t:'trans', date:'11月15日', title:'Kutná Hora 一日遊', sub:'來回布拉格 · 2-10°C ☀', r:'C9'},
  {t:'fly', date:'11月16日', title:'Prague ✈ 香港', sub:'EK140 2:45pm · 3-9°C 歸家', pts:[STOPS.Prague, STOPS.HK]}
];

const map = L.map('map', {zoomControl:true}).setView([46.5, 6], 6);
// 底圖鏈（全部實測過「無Referer/file://」環境出到真圖）：
// Esri街道圖 → Wikimedia → OpenTopoMap → OSM法國
// 注意：OSM官方同CARTO已剔除——前者file://無Referer會403，後者要API key
const baseLayers = [
  () => L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    {maxZoom: 19, attribution: 'Esri, HERE, Garmin, FAO, NOAA, USGS, OpenStreetMap contributors'}),
  () => L.tileLayer('https://maps.wikimedia.org/osm-intl/{z}/{x}/{y}.png',
    {maxZoom: 19, attribution: '© OpenStreetMap · Wikimedia'}),
  () => L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
    {maxZoom: 17, subdomains: 'abc', attribution: '© OpenStreetMap · OpenTopoMap (CC-BY-SA)'}),
  () => L.tileLayer('https://tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',
    {maxZoom: 19, attribution: '© OpenStreetMap contributors, OpenStreetMap France'})
];
let bi = 0, base = null, baseErrs = 0;
function loadBase() {
  if (base) map.removeLayer(base);
  base = baseLayers[bi]().addTo(map);
  baseErrs = 0;
  base.on('tileerror', () => {
    baseErrs++;
    if (baseErrs >= 2 && bi < baseLayers.length - 1) { bi++; loadBase(); }
  });
  base.on('tileload', () => { baseErrs = 0; });
}
loadBase();

const styles = {
  walk:{color:'#16a34a', weight:5, opacity:.9},
  trans:{color:'#2563eb', weight:4, opacity:.85, dashArray:'10 8'},
  fly:{color:'#dc2626', weight:3, opacity:.8, dashArray:'2 10'}
};
const layers = {walk:L.layerGroup(), trans:L.layerGroup(), fly:L.layerGroup()};
Object.values(layers).forEach(l => l.addTo(map));

const polylines = {}; // id -> polyline
const side = document.getElementById('side');
let cur = null;

ITEMS.forEach((it, i) => {
  if (it.g) {
    const h = document.createElement('div');
    h.className = 'sec'; h.textContent = it.g;
    side.appendChild(h); return;
  }
  it._id = 'i' + i;
  const el = document.createElement('div');
  el.className = 'item ' + it.t;
  el.innerHTML = `<span class="dot ${it.t}"></span><div style="flex:1">
      <span class="date">${it.date}</span><b>${it.title}</b>
      <div class="sub">${it.sub}${it.km ? ' · <span class="km">' + it.km + '</span>' : ''}</div>
      ${it.badge ? '<span class="badge">' + it.badge + '</span>' : ''}
    </div>`;
  el.onclick = () => select(it, el);
  side.appendChild(el);

  let pl = null;
  if (it.r && R[it.r]) {
    pl = L.polyline(R[it.r].line, styles[it.t]).bindTooltip(`${it.title} · ${R[it.r].km}km（實際路徑）`, {sticky:true});
  } else if (it.pts) {
    pl = L.polyline(it.pts, styles[it.t]).bindTooltip(it.title, {sticky:true});
  } else if (it.at) {
    pl = L.circleMarker(it.at, {radius:7, color:'#fff', weight:2, fillColor:'#d97706', fillOpacity:1})
        .bindTooltip(it.title, {sticky:true});
  }
  if (pl) {
    pl.addTo(layers[it.t] || layers.trans);
    polylines[it._id] = pl;
    it._pl = pl;
  }
});

function select(it, el) {
  document.querySelectorAll('.item').forEach(x => x.classList.remove('act'));
  el.classList.add('act');
  if (it._pl) {
    if (it._pl.getBounds) {
      map.flyToBounds(it._pl.getBounds(), {padding:[46, 46], maxZoom: 12, duration:.7});
    } else if (it.at) {
      map.flyTo(it.at, 11, {duration:.7});
    }
    if (it._pl.openPopup) it._pl.openPopup();
  }
}

document.querySelectorAll('.chip[data-k]').forEach(c => {
  c.onclick = () => {
    c.classList.toggle('on');
    const k = c.dataset.k;
    if (map.hasLayer(layers[k])) map.removeLayer(layers[k]); else layers[k].addTo(map);
  };
});

document.getElementById('fitAll').onclick = () => {
  const b = L.latLngBounds([]);
  Object.values(polylines).forEach(pl => { if (pl.getBounds) b.extend(pl.getBounds()); });
  map.flyToBounds(b, {padding:[40, 40], duration:.8});
};

// 初始視野：歐洲行程（唔計香港航線）
(function () {
  const b = L.latLngBounds([]);
  Object.values(polylines).forEach(pl => {
    if (!pl.getBounds) return;
    const g = pl.getBounds();
    if (g.getSouth() > 30) b.extend(g); // 排除含香港（~22°N）嘅航班線
  });
  map.fitBounds(b, {padding:[30, 30]});
})();
